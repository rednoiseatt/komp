<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Compass">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>Compass</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #f1ebdc; overflow: hidden; }
  body { font-family: Georgia, "Times New Roman", serif; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 76px) 28px calc(env(safe-area-inset-bottom) + 84px);
    text-align: center; opacity: 0; pointer-events: none; transition: opacity .25 ease;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .screen.on { opacity: 1; pointer-events: auto; transition: opacity .35s ease .25s; }

  .text { font-size: 15px; line-height: 1.6; max-width: 420px; margin: 0; letter-spacing: .02em; }
  .label { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #8a8372; margin: 0 0 22px; }
  .small { font-size: 15px; line-height: 1.5; color: #8a8372; margin: 12px 0 0; letter-spacing: .02em; }
  .btn { display: block; width: min(74vw, 280px); margin: 0 auto; padding: 14px 20px; background: none; color: #f1ebdc;
         border: 1px solid #5a574f; border-radius: 999px; font: 15px Georgia, serif; letter-spacing: .06em; cursor: pointer; }
  .btn:active { background: #1c1b18; }
  .link { background: none; border: 0; color: #77746b; font: 15px Georgia, serif; letter-spacing: .1em; padding: 12px 14px; cursor: pointer; }
  .link:active { color: #aaa; }
  .stack { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 40px; }
  .row { display: flex; gap: 6px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }

  /* every sub-screen: its name at the very top, back/home at the very bottom */
  .hd { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top) + 24px); text-align: center; pointer-events: none;
        font-size: 15px; letter-spacing: .24em; padding-left: .24em; color: #cfc9ba; }
  .ft { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 16px); display: flex; justify-content: center; gap: 6px; }
  #ready.quoted #notYet { display: none; }

  /* HOME: a circle with three words around it */
  .ring { --D: min(70vw, 36vh, 330px); position: relative; width: var(--D); height: var(--D); }
  .circle { position: absolute; inset: 0; border: 1px solid #8a8372; border-radius: 50%;
            animation: breathe 9s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 0%,100% { transform: scale(.88); opacity: .45; } 50% { transform: scale(1.06); opacity: 1; } }
  /* each word sits at angle --a, distance --k times the circle width from its centre */
  .word { position: absolute; left: 50%; top: 50%; background: none; border: 0; color: #f1ebdc; font: 15px Georgia, serif;
          letter-spacing: .24em; padding: 22px 22px 22px calc(22px + .24em); cursor: pointer; white-space: nowrap;
          transform: rotate(var(--a)) translateX(calc(var(--D) * var(--k))) rotate(calc(var(--a) * -1)) translate(-50%, -50%); }
  .word:active { color: #8a8372; }

  /* TENDER: four quadrants */
  .quad { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px; background: #2e2c27;
          width: min(92vw, 480px); height: min(calc(100vh - 200px), 680px); border: 1px solid #2e2c27; }
  .quad button { background: #000; color: #f1ebdc; border: 0; font: 15px/1.3 Georgia, serif; padding: 12px; cursor: pointer; letter-spacing: .06em; }
  .quad button:active { background: #14130f; }

  /* reading pages */
  .page { justify-content: flex-start; align-items: stretch; text-align: left; }
  .page .wrap { width: 100%; max-width: 520px; margin: 0 auto; padding-bottom: 30px; }
  .page h2 { font-weight: normal; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #8a8372; margin: 4px 0 24px; text-align: center; }
  .page p { margin: 0 0 14px; font-size: 15px; line-height: 1.55; letter-spacing: .02em; }

  /* LOST */
  .dots { display: flex; gap: 10px; margin-bottom: 30px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid #77746b; }
  .dots i.on { background: #f1ebdc; border-color: #f1ebdc; }
  .mini { width: 56px; height: 56px; border: 1px solid #77746b; border-radius: 50%; margin: 0 auto 34px; animation: breathe 9s ease-in-out infinite; }
  /* the text block has a fixed height, so the dots, label and button never move between steps */
  #lostText { height: 8em; }
  #lost .label { height: 1.2em; }
  #lost .stack { margin-top: 24px; }

  /* READY: slide to confirm */
  .slide { position: relative; width: min(82vw, 340px); height: 62px; border: 1px solid #5a574f; border-radius: 999px; transition: opacity .6s; }
  .slide .slide-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 44px;
                        font-size: 15px; letter-spacing: .06em; color: #cfc9ba; pointer-events: none; }
  .knob { position: absolute; left: 3px; top: 3px; width: 54px; height: 54px; border-radius: 50%; background: #f1ebdc; touch-action: none; cursor: grab; }
  .knob::after { content: ""; position: absolute; left: 20px; top: 21px; width: 10px; height: 10px; border-top: 2px solid #111; border-right: 2px solid #111; transform: rotate(45deg); }
  .slide.locked { opacity: .28; }
  .slide.locked .knob { cursor: default; }
  .slide.done { border-color: #f1ebdc; }
  #readyArea { transition: opacity 1s; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #readyArea.gone { opacity: 0; pointer-events: none; display: none; }
  #quoteBox { display: none; opacity: 0; transition: opacity 2s ease; }
  #quoteBox.show { opacity: 1; }

  /* UNLOCK */
  input[type=password] { width: min(78vw, 300px); background: #0e0e0c; color: #f1ebdc; border: 1px solid #3a3832; border-radius: 999px;
                         padding: 15px 20px; font: 16px Georgia, serif; text-align: center; margin-bottom: 14px; -webkit-user-select: text; user-select: text; }
  input[type=password]:focus { outline: none; border-color: #77746b; }
  .err { color: #b38b7a; font-size: 15px; min-height: 20px; margin: 0 0 12px; }
</style>
</head>
<body>

<!-- UNLOCK (only when your content is encrypted) -->
<div class="screen" id="unlock">
  <p class="label">compass</p>
  <form id="unlockForm" autocomplete="off">
    <input type="password" id="pass" placeholder="passphrase" autocomplete="off" autocapitalize="off" autocorrect="off">
    <p class="err" id="err"></p>
    <button class="btn" type="submit">open</button>
  </form>
</div>

<!-- HOME -->
<div class="screen" id="home">
  <div class="ring">
    <div class="circle"></div>
    <button class="word" id="wT" style="--a:-90deg; --k:.7386" data-go="tender">tender</button>
    <button class="word" id="wL" style="--a:120deg; --k:.768" data-go="lost">lost</button>
    <button class="word" id="wR" style="--a:60deg;  --k:.7807" data-go="ready">ready</button>
  </div>
</div>

<!-- TENDER -->
<div class="screen" id="tender">
  <div class="hd">tender</div>
  <div class="quad">
    <button data-page="who">who am I?</button>
    <button data-page="rules">my rules</button>
    <button data-page="routine">my routine</button>
    <button data-page="interests">my interests</button>
  </div>
  <div class="ft"><button class="link" data-go="home">home</button></div>
</div>
<div class="screen page" id="page">
  <div class="hd">tender</div>
  <div class="wrap">
    <h2 id="pageTitle"></h2>
    <div id="pageBody"></div>
  </div>
  <div class="ft"><button class="link" data-go="tender">back</button></div>
</div>

<!-- LOST -->
<div class="screen" id="lost">
  <div class="hd">lost</div>
  <div class="dots"><i></i><i></i><i></i></div>
  <div class="mini" id="lostMini"></div>
  <p class="label" id="lostLabel"></p>
  <p class="text" id="lostText"></p>
  <div class="stack">
    <button class="btn" id="lostNext">next</button>
  </div>
  <div class="ft"><button class="link" data-go="home">home</button></div>
</div>

<!-- READY -->
<div class="screen" id="ready">
  <div class="hd">ready</div>
  <div id="readyArea">
    <div class="slide" id="s1"><div class="slide-label">am I kind to myself?</div><div class="knob"></div></div>
    <div class="slide locked" id="s2"><div class="slide-label">start the task</div><div class="knob"></div></div>
    <p class="small" id="readySub">you know it will be better once you start</p>
  </div>
  <div id="quoteBox">
    <p class="text" id="quoteText"></p>
  </div>
  <div class="ft">
    <button class="link" data-go="tender" id="notYet">not yet</button>
    <button class="link" data-go="home">home</button>
  </div>
</div>

<script>
/* ============================================================
   YOUR PRIVATE CONTENT
   Leave this empty to see the sample content.
   To keep your own text private: make it at encrypt.html, paste
   the long code it gives you between the quotes below.
   ============================================================ */
const ENCRYPTED = "";

/* Sample content shown until you add your own. */
const DEMO = {
  who: ["Sample", "Sample"],
  rules: ["Sample", "Sample"],
  routine: ["Sample", "Sample"],
  interests: ["Sample", "Sample"]
};

/* Not private. These live in the file for everyone to see. */
const LOST_STEPS = [
  { label: "sit with it", text: "Stay here for a moment. You don't have to fix anything or work anything out. Just notice where you feel it, and let it be there." },
  { label: "time heals", text: "This feeling has a shape and an edge, even if you can't see the edge yet. You've felt low before and it moved. It will move again." },
  { label: "self-compassion", text: "Say to yourself: this is hard, and I'm allowed to find it hard. Then ask, what would I say to a friend who felt like this?" }
];

const QUOTES = [
  "Starting is the hard part, and you already have.",
  "You don't have to do it well. You just have to do it.",
  "Ten minutes is enough to change a day.",
  "Small and done beats perfect and waiting.",
  "You're allowed to begin badly.",
  "Momentum is built, not found. Go build a little.",
  "Whatever you do now, future you will be glad of it."
];
/* ============================================================ */

const $ = id => document.getElementById(id);
const screens = document.querySelectorAll('.screen');
let current = 'unlock', data = DEMO, quotes = QUOTES.slice();

/* ---------- navigation ---------- */
function go(id) {
  if (id === current) return;
  screens.forEach(s => s.classList.toggle('on', s.id === id));
  current = id;
  const sc = $(id); if (sc) sc.scrollTop = 0;
  if (id === 'lost') showStep(0);
  if (id === 'ready') resetReady();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go]'); if (t) { go(t.dataset.go); return; }
  const p = e.target.closest('[data-page]'); if (p) openPage(p.dataset.page);
});

/* ---------- tender pages ---------- */
const TITLES = { who: "who am I?", rules: "my rules", routine: "my routine", interests: "my interests" };
function openPage(key) {
  $('pageTitle').textContent = TITLES[key];
  const body = $('pageBody'); body.innerHTML = '';
  const items = (data[key] && data[key].length) ? data[key] : ["Nothing here yet."];
  items.forEach(x => { const p = document.createElement('p'); p.textContent = x; body.appendChild(p); });
  go('page');
}

/* ---------- lost: step by step ---------- */
let step = 0;
function showStep(i) {
  step = i;
  $('lostLabel').textContent = LOST_STEPS[i].label;
  $('lostText').textContent = LOST_STEPS[i].text;
  document.querySelectorAll('.dots i').forEach((d, k) => d.classList.toggle('on', k === i));
  $('lostNext').textContent = i === LOST_STEPS.length - 1 ? 'I’m okay for now' : 'next';
}
$('lostNext').addEventListener('click', () => {
  if (step < LOST_STEPS.length - 1) showStep(step + 1); else go('home');
});

/* ---------- ready: two slide-to-confirm switches ---------- */
function makeSlider(root, onDone) {
  const knob = root.querySelector('.knob'), lab = root.querySelector('.slide-label');
  let startX = 0, pos = 0, max = 0, drag = false, done = false;
  const place = () => { knob.style.transform = 'translateX(' + pos + 'px)'; };
  knob.addEventListener('pointerdown', e => {
    if (done || root.classList.contains('locked')) return;
    drag = true; max = root.clientWidth - knob.offsetWidth - 8;
    startX = e.clientX - pos; knob.setPointerCapture(e.pointerId); knob.style.transition = 'none';
  });
  knob.addEventListener('pointermove', e => {
    if (!drag) return;
    pos = Math.max(0, Math.min(max, e.clientX - startX)); place();
    lab.style.opacity = Math.max(0, 1 - pos / max * 1.2);
  });
  const end = () => {
    if (!drag) return; drag = false; knob.style.transition = 'transform .3s ease';
    if (pos >= max * 0.88) { pos = max; done = true; place(); root.classList.add('done'); setTimeout(onDone, 450); }
    else { pos = 0; place(); lab.style.opacity = 1; }
  };
  knob.addEventListener('pointerup', end); knob.addEventListener('pointercancel', end);
  return { reset() { done = false; drag = false; pos = 0; knob.style.transition = 'none'; place(); lab.style.opacity = 1; root.classList.remove('done'); } };
}
const sl1 = makeSlider($('s1'), () => { $('s2').classList.remove('locked'); });
const sl2 = makeSlider($('s2'), () => {
  $('readyArea').classList.add('gone'); $('ready').classList.add('quoted');
  if (!quotes.length) quotes = QUOTES.slice();
  const i = Math.floor(Math.random() * quotes.length);
  $('quoteText').textContent = quotes.splice(i, 1)[0];
  const q = $('quoteBox'); q.style.display = 'block'; void q.offsetWidth; q.classList.add('show');
});
function resetReady() {
  sl1.reset(); sl2.reset(); $('s2').classList.add('locked');
  $('readyArea').classList.remove('gone'); $('ready').classList.remove('quoted');
  const q = $('quoteBox'); q.classList.remove('show'); q.style.display = 'none';
}

/* ---------- decrypting your private content ---------- */
// accepts the URL-safe form (and the older +/ form), ignores stray spaces or line breaks
const b64d = s => {
  s = s.replace(/[\s"';]/g, '').replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return Uint8Array.from(atob(s), c => c.charCodeAt(0));
};
async function decrypt(blob, pass) {
  const raw = b64d(blob), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct));
}
const CACHE = 'compass-private';
function cached() {
  try { const c = JSON.parse(localStorage.getItem(CACHE)); if (c && c.blob === ENCRYPTED) return c.data; } catch (e) {}
  return null;
}
$('unlockForm').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = '';
  try {
    const text = await decrypt(ENCRYPTED, $('pass').value);
    data = JSON.parse(text);
    if (Array.isArray(data.quotes)) quotes = QUOTES.concat(data.quotes);
    try { localStorage.setItem(CACHE, JSON.stringify({ blob: ENCRYPTED, data })); } catch (x) {}
    $('pass').value = ''; go('home');
  } catch (x) { $('err').textContent = "that didn't open it"; }
});

/* ---------- start ---------- */
(function init() {
  let first = 'home';
  if (ENCRYPTED) {
    const c = cached();
    if (c) { data = c; if (Array.isArray(c.quotes)) quotes = QUOTES.concat(c.quotes); }
    else first = 'unlock';
  }
  screens.forEach(s => s.classList.toggle('on', s.id === first));
  current = first;
})();
</script>
</body>
</html>
